<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ESIC Campus Assistant</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="app">

    <div id="appLayout" class="app-layout">

        <!-- =====================================================
             SIDEBAR
        ====================================================== -->

        <aside class="conversation-sidebar">

            <div class="sidebar-header">

                <!-- LOGO ESIC -->
                <div class="sidebar-logo">
                    <img
                        src="./logo.png"
                        alt="ESIC"
                        class="sidebar-logo-image"
                    >
                </div>

                <h2>Mes discussions</h2>

            </div>


            <!-- NOUVELLE CONVERSATION -->

            <button
                id="newConversationButton"
                class="new-conversation-button"
                type="button"
            >
                + Nouvelle conversation
            </button>


            <!-- HISTORIQUE -->

            <div class="conversation-history">

                <h3>Historique</h3>

                <div id="historyList"></div>

            </div>


            <!-- EFFACER HISTORIQUE -->

            <button
                id="clearHistoryButton"
                class="clear-history-button"
                type="button"
            >
                🗑 Effacer tout l'historique
            </button>

        </aside>


        <!-- =====================================================
             ZONE CHAT
        ====================================================== -->

        <div class="chat-area">

            <!-- =================================================
                 TOPBAR
            ================================================== -->

            <header class="topbar">

                <div class="topbar-left">

                    <!-- BOUTON SIDEBAR -->

                    <button
                        id="sidebarToggle"
                        class="sidebar-toggle"
                        type="button"
                        aria-label="Fermer les discussions"
                        aria-expanded="true"
                    >
                        ☰
                    </button>


                    <!-- BRAND -->

                    <div class="brand">

                        <img
                            src="./logo.png"
                            alt="ESIC"
                            class="esic-logo"
                        >

                        <div class="brand-divider"></div>

                        <div class="assistant-brand">

                            <h1>Campus Assistant</h1>

                            <span>
                                Assistant virtuel éducatif
                            </span>

                        </div>

                    </div>

                </div>


                <!-- STATUT -->

                <div class="status">

                    <span class="status-dot"></span>

                    En ligne

                </div>

            </header>


            <!-- =================================================
                 CONTENU
            ================================================== -->

            <main class="chat-container">

                <!-- BIENVENUE -->

                <section class="welcome-section">

                    <div class="bot-avatar large">

                        <span class="bot-avatar-mark large-mark">
                            AI
                        </span>

                    </div>

                    <h2>
                        Bienvenue sur l'Assistant ESIC 👋
                    </h2>

                    <p>
                        Posez votre question sur le campus,
                        les formations, les horaires,
                        les contacts ou la vie étudiante.
                    </p>

                    <div
                        id="suggestions"
                        class="suggestions"
                    ></div>

                </section>


                <!-- MESSAGES -->

                <section
                    id="conversation"
                    class="messages-container"
                    aria-live="polite"
                ></section>


                <!-- ZONE SAISIE -->

                <section class="input-area">

                    <div class="input-wrapper">

                        <input
                            id="question"
                            type="text"
                            autocomplete="off"
                            placeholder="Écrivez votre question..."
                        >

                        <button
                            id="sendButton"
                            class="send-button"
                            type="button"
                            aria-label="Envoyer"
                        >
                            ➤
                        </button>

                    </div>

                    <div class="input-hint">

                        <span id="sessionInfo">
                            Session #-
                        </span>

                        · Appuyez sur Entrée pour envoyer

                    </div>

                </section>

            </main>


            <!-- FOOTER -->

            <footer class="footer">

                <span>ESIC</span>

                <span class="footer-separator">•</span>

                <span>
                    Assistant virtuel campus
                </span>

            </footer>

        </div>

    </div>

</div>


<script src="script.js"></script>

</body>
</html>
